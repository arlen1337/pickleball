<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pickleball Bracket</title>
<meta name="description" content="Schedule, score and seed a pickleball doubles tournament. Works offline.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1b4f86" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f3357" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pickleball">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/barlow-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Layout: courtside scorer's console. Court-blue header band with a top-down court drawing, sticky section tabs,
   then a time rail on the left of each round with court cards to the right; stacks to one column on a phone. */
:root {
  --bg: #eef2f6;
  --surface: #ffffff;
  --surface-2: #f5f8fb;
  --ink: #102133;
  --muted: #55667a;
  --line: #d3dce6;
  --band: #1b4f86;
  --band-ink: #ffffff;
  --band-muted: #c2d6ec;
  --accent: #1b5ea6;
  --accent-ink: #ffffff;
  --accent-soft: #e2ecf7;
  --ball: #d4e157;
  --ball-edge: #8a9419;
  --good: #146c43;
  --good-soft: #e1f2e8;
  --warnc: #8f5400;
  --warn-soft: #fbefd9;
  --bad: #b3261e;
  --bad-soft: #fbe4e2;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1520; --surface: #122131; --surface-2: #172a3d; --ink: #e6edf5; --muted: #9aabbd; --line: #27394d;
    --band: #0f3357; --band-ink: #f2f7fc; --band-muted: #a3c0de; --accent: #6aaef0; --accent-ink: #06121e; --accent-soft: #173452;
    --ball: #d9e55a; --ball-edge: #e9f28c; --good: #63d39c; --good-soft: #13321f; --warnc: #f2b75b; --warn-soft: #382a12;
    --bad: #ff8f86; --bad-soft: #3d1a18; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1520; --surface: #122131; --surface-2: #172a3d; --ink: #e6edf5; --muted: #9aabbd; --line: #27394d;
  --band: #0f3357; --band-ink: #f2f7fc; --band-muted: #a3c0de; --accent: #6aaef0; --accent-ink: #06121e; --accent-soft: #173452;
  --ball: #d9e55a; --ball-edge: #e9f28c; --good: #63d39c; --good-soft: #13321f; --warnc: #f2b75b; --warn-soft: #382a12;
  --bad: #ff8f86; --bad-soft: #3d1a18; color-scheme: dark;
}

@font-face { font-family: "Barlow"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/barlow-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow"; font-style: normal; font-weight: 500; font-display: swap; src: url("fonts/barlow-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/barlow-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow"; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/barlow-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 500; font-display: swap; src: url("fonts/barlow-condensed-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/barlow-condensed-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/barlow-condensed-latin-700-normal.woff2") format("woff2"); }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h2, h3 { text-wrap: balance; }

.band { background: var(--band); color: var(--band-ink); }
.band-in, .tabs-in, .wrap, .foot-in {
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.band-in { padding-block: 22px 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.head-text { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.eyebrow { margin: 0; font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--band-muted); }
h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(30px, 7vw, 46px); line-height: .95; letter-spacing: .01em; text-transform: uppercase; }
.meta { margin: 2px 0 0; color: var(--band-muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.court { width: 132px; flex: none; color: var(--band-ink); opacity: .85; }
.court .ball { fill: var(--ball); }

.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs-in { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs-in::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; cursor: pointer; padding: 13px 10px 10px; border-bottom: 3px solid transparent;
  font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

.wrap { padding-block: 20px 40px; display: flex; flex-direction: column; gap: 18px; }
.sec-head { display: flex; flex-direction: column; gap: 4px; }
.sec-head h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 28px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
.sub { margin: 0; color: var(--muted); max-width: 65ch; }
.fine { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 70ch; }

/* plan strip */
.plan, .preview { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.flow { margin: 0; font-size: 17px; }
.flow strong { font-weight: 700; }
.arrow { color: var(--muted); padding: 0 2px; }
.facts { margin: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.chip.ok { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warnc); }
.chip.done { background: var(--accent-soft); color: var(--accent); }
.chip.wait { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }

.note { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 12px 16px; border-radius: var(--r); background: var(--warn-soft); color: var(--ink); }
.note p { margin: 0; min-width: 0; flex: 1 1 260px; }

/* rounds */
.slot { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.rail { display: flex; flex-direction: column; gap: 2px; padding-top: 4px; }
.time { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.time small { font-size: 14px; font-weight: 600; margin-left: 3px; color: var(--muted); letter-spacing: .04em; }
.rlabel { font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.slot-po .rlabel { color: var(--accent); }
.slot-body { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.sit { margin: 0; font-size: 13.5px; color: var(--muted); }
.sit span { font-family: var(--display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-right: 4px; }

/* match card */
.match { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.match.final { background: var(--surface-2); }
.match.po { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.mh { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 22px; }
.mtitle { margin: 0 0 2px; font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .03em; text-transform: uppercase; }
.mtitle span { font-weight: 600; font-size: 14px; color: var(--muted); margin-left: 4px; letter-spacing: .06em; }
.side { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 42px; }
.side + .side { border-top: 1px dashed var(--line); }
.tname { min-width: 0; overflow-wrap: anywhere; font-weight: 500; display: flex; flex-direction: column; }
.side.win .tname { font-weight: 700; }
.side.win .tname::before { content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--ball); box-shadow: inset 0 0 0 1.5px var(--ball-edge); display: inline-block; position: relative; top: 1px; margin-right: 7px; float: left; }
.side.win .tname { display: block; }
.hint { color: var(--muted); font-style: italic; }
.lead { font-size: 13px; color: var(--muted); }
.pts { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }
.side:not(.win) .pts { color: var(--muted); }
.pts.dim { color: var(--line); }
.score { width: 60px; height: 42px; flex: none; text-align: center; border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
  font-family: var(--display); font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; -moz-appearance: textfield; appearance: textfield; }
.score::-webkit-outer-spin-button, .score::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.score:focus { border-color: var(--accent); }
.mf { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 6px; }
.err { margin: 4px 0 0; color: var(--bad); font-size: 13.5px; }

/* buttons */
.btn { border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); padding: 9px 14px; font-weight: 600; cursor: pointer; }
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { opacity: .6; cursor: progress; }
.btn-small { padding: 7px 12px; }
.btn-big { padding: 12px 20px; font-size: 16px; }
.btn-link { border: 0; background: none; padding: 6px 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.btn-link.danger { color: var(--bad); }
.btn-ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; font-weight: 600; cursor: pointer; }
.btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn-ghost:disabled, .icon-btn:disabled { opacity: .4; cursor: not-allowed; }
.danger-btn { background: var(--bad); color: #fff; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }

/* standings */
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tbl th { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl .tm { text-align: left; white-space: normal; min-width: 140px; font-weight: 500; }
.tbl .rk { font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--muted); width: 1%; text-align: left; }
.tbl tr.in .rk { color: var(--accent); }
.tbl td b { font-weight: 700; }
.tbl tr.cut td { padding: 0; border-bottom: 0; text-align: left; }
.tbl tr.cut span { display: block; border-top: 2px dashed var(--ball-edge); margin-top: -1px; padding: 3px 12px; font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ball-edge); background: color-mix(in srgb, var(--ball) 14%, transparent); }

/* playoffs */
.champ { display: flex; flex-direction: column; gap: 2px; padding: 16px 18px; border-radius: var(--r); background: var(--band); color: var(--band-ink); border-left: 6px solid var(--ball); }
.champ .eyebrow { color: var(--band-muted); }
.champ strong { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; text-transform: uppercase; overflow-wrap: anywhere; }
.champ-score { color: var(--band-muted); font-variant-numeric: tabular-nums; }
.bracket { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "sfh fh" "sf1 fin" "sf2 fin"; gap: 12px 44px; align-items: center; }
.col-h { margin: 0; font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.sf-h { grid-area: sfh; } .f-h { grid-area: fh; }
.br-sf1 { grid-area: sf1; } .br-sf2 { grid-area: sf2; }
.br-sf { position: relative; }
.br-sf::after { content: ""; position: absolute; right: -22px; top: 50%; width: 22px; border-top: 2px solid var(--line); }
.br-fin { grid-area: fin; position: relative; align-self: stretch; display: flex; align-items: center; }
.br-fin::before { content: ""; position: absolute; left: -22px; top: 25%; bottom: 25%; border-left: 2px solid var(--line); }
.br-fin::after { content: ""; position: absolute; left: -22px; top: 50%; width: 22px; border-top: 2px solid var(--line); }
.br-fin .match { width: 100%; }
.po-final { border-width: 2px; }
.third, .single { display: flex; flex-direction: column; gap: 8px; max-width: calc(50% - 22px); min-width: 0; }

/* rules */
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.rule-group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.rule-group h3 { margin: 0 0 6px; font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.rule-group ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.rule-group li::marker { color: var(--ball-edge); }

/* setup */
.setup { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 14px; align-items: start; }
.fs-stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.fs { margin: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.fs legend { padding: 0 6px; margin-left: -6px; font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .06em; text-transform: uppercase; }
.fs legend small { font-weight: 600; font-size: 13px; color: var(--muted); letter-spacing: .06em; margin-left: 6px; }
.fs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 12px; }
.fs-grid legend { grid-column: 1 / -1; }
.team-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.team-list li { display: grid; grid-template-columns: 26px minmax(0, 1fr) 36px; gap: 8px; align-items: center; }
.tn { font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.team-list input, .fld input, .fld select { width: 100%; min-width: 0; height: 42px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 16px; color: var(--ink); }
.team-list input:focus, .fld input:focus, .fld select:focus { border-color: var(--accent); }
.icon-btn { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 20px; line-height: 1; cursor: pointer; color: var(--muted); }
.icon-btn:hover:not(:disabled) { color: var(--bad); border-color: var(--bad); }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: 13.5px; color: var(--muted); }
.segs { display: flex; flex-wrap: wrap; gap: 6px; }
.seg input, .pcard input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 42px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); cursor: pointer;
  font-family: var(--display); font-weight: 700; font-size: 22px; }
.seg input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg input:focus-visible + span, .pcard input:focus-visible + .pc-in { outline: 2px solid var(--accent); outline-offset: 2px; }
.pcards { display: flex; flex-direction: column; gap: 8px; }
.pcard { position: relative; display: block; cursor: pointer; }
.pc-in { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.pcard input:checked + .pc-in { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.pc-name { font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .04em; text-transform: uppercase; }
.pc-name small { font-weight: 600; font-size: 13px; color: var(--muted); margin-left: 6px; letter-spacing: .04em; }
.pc-line { font-weight: 500; }
.pc-fit { font-size: 13.5px; color: var(--muted); }
.preview h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .06em; text-transform: uppercase; }
.warn-text { margin: 0; color: var(--bad); }
.confirm { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 8px; background: var(--bad-soft); }
.confirm p { margin: 0; }
.ro-teams { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }

.foot-in { padding-block: 0 28px; }
.foot p { margin: 0; color: var(--muted); font-size: 13px; }
.toast { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  max-width: min(440px, calc(100vw - 32px)); padding: 11px 16px; border-radius: 10px; background: var(--ink); color: var(--bg); font-weight: 500; box-shadow: 0 6px 24px rgba(0, 0, 0, .25); }

@media (max-width: 640px) {
  .court { width: 92px; }
  .slot { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .rail { flex-direction: row; align-items: baseline; gap: 10px; padding-top: 0; }
  .time { font-size: 26px; }
  .games { grid-template-columns: minmax(0, 1fr); }
  .bracket { grid-template-columns: minmax(0, 1fr); grid-template-areas: "sfh" "sf1" "sf2" "fh" "fin"; gap: 10px; }
  .br-sf::after, .br-fin::before, .br-fin::after { display: none; }
  .third, .single { max-width: none; }
  .setup { grid-template-columns: minmax(0, 1fr); }
  .fs-grid { grid-template-columns: minmax(0, 1fr); }
  .tabs-in { gap: 0; justify-content: space-between; }
  .tab { font-size: 15px; letter-spacing: .03em; padding-inline: 6px; }
}
@media (max-width: 380px) {
  .court { display: none; }
}
/* app extras: data section, file picker, copy box */
.file-btn { position: relative; display: inline-flex; align-items: center; }
.file-btn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.file-btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.danger-ghost { color: var(--bad); }
.danger-ghost:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
.copybox { display: flex; flex-direction: column; gap: 6px; }
.copybox textarea { width: 100%; min-width: 0; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink);
  font: 14px/1.5 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; resize: vertical; }
.install { background: var(--accent-soft); }
.lockrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.lockrow .fine { flex: 1 1 200px; }
.gate-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 420px; }
.gate-label { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: .05em; text-transform: uppercase; }
.gate-card input { height: 54px; width: 100%; min-width: 0; padding: 0 12px; font-family: var(--display); font-weight: 700; font-size: 28px; letter-spacing: .3em; text-align: center;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.gate-card input:focus { border-color: var(--accent); }
.gate-card .err { margin: 0; }

@media print {
  :root:not(#print-root) {
    --bg: #fff; --surface: #fff; --surface-2: #fff; --ink: #000; --muted: #333; --line: #888;
    --band: #fff; --band-ink: #000; --band-muted: #333; --accent: #000; --accent-soft: #fff; --ball: #fff; --ball-edge: #000; color-scheme: light;
  }
  :root { padding: 0; }
  body { font-size: 12px; min-height: 0; }
  body::before, .tabs, .foot, .toast, .note, .no-print, .mf, .err, .court { display: none !important; }
  .band-in { padding-block: 0 6px; border-bottom: 2px solid #000; }
  .wrap { padding-block: 10px 0; gap: 10px; }
  .slot { break-inside: avoid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; padding-top: 8px; }
  .rail { flex-direction: column; }
  .games { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .match { padding: 6px 8px; break-inside: avoid; }
  .side { min-height: 32px; }
  .score { width: 44px; height: 30px; border: 1px solid #000; background: #fff; }
  .plan { border: 0; padding: 0; }
}

@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
}

</style>

      .then(function (bits) { return open(bits).then(function (js) { try { localStorage.setItem(KEY, b64(bits)); } catch (e) { } start(js); }); })
      .catch(function () {
        btn.disabled = false; btn.textContent = 'Unlock'; pin.value = ''; pin.focus();
        say('That PIN isn’t right. Try again.');
      });
  });
})();
